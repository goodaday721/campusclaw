# Nginx reverse proxy for the api service (the ONLY host-exposed entrypoint).

# Docker's embedded DNS. Resolving at request time (via the variable below)
# keeps the proxy working when the api container is recreated and gets a new
# internal IP — a static proxy_pass would cache the old IP and return 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Match the api's UPLOAD_MAX_SIZE_MB cap so large uploads are rejected by
    # the api (413 with JSON) rather than silently by the proxy.
    client_max_body_size 50m;

    location / {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
